<div class="min-h-screen flex flex-col items-center justify-center p-6 relative overflow-hidden bg-gradient-to-br from-[#fff0f3] via-[#ffb3c6] to-[#ffccd5]">
  
  <!-- Floating Hearts Background -->
  <div class="absolute inset-0 pointer-events-none opacity-40">
    <div class="floating-heart text-amor-red text-4xl" style="left: 10%; animation-delay: 0s;">❤️</div>
    <div class="floating-heart text-amor-pink text-5xl" style="left: 30%; animation-delay: 2s;">💖</div>
    <div class="floating-heart text-amor-red text-2xl" style="left: 50%; animation-delay: 4s;">💘</div>
    <div class="floating-heart text-amor-pink text-3xl" style="left: 70%; animation-delay: 1s;">💓</div>
    <div class="floating-heart text-amor-gold text-4xl" style="left: 90%; animation-delay: 3s;">✨</div>
    <div class="floating-heart text-amor-red text-6xl" style="left: 20%; animation-delay: 5s;">💞</div>
    <div class="floating-heart text-amor-pink text-3xl" style="left: 80%; animation-delay: 6s;">💝</div>
    <div class="floating-heart text-amor-gold text-2xl" style="left: 40%; animation-delay: 7s;">✨</div>
  </div>

  <!-- Main Card -->
  <div class="bg-white/70 backdrop-blur-xl rounded-3xl shadow-[0_20px_50px_rgba(255,179,198,0.5)] p-8 max-w-md w-full text-center border border-white/60 transform transition-all duration-700 hover:scale-[1.03] hover:shadow-[0_30px_60px_rgba(255,0,0,0.2)] relative z-10">
    <div class="relative w-40 h-40 mx-auto mb-6 rounded-full p-2 bg-gradient-to-tr from-amor-gold via-amor-pink to-amor-red shadow-lg sparkle-effect">
      <div class="w-full h-full rounded-full bg-gray-200 overflow-hidden border-4 border-white">
        <img src="https://images.unsplash.com/photo-1518199266791-5375a83164ba?q=80&w=400&auto=format&fit=crop" alt="Nosso Momento" class="w-full h-full object-cover">
      </div>
    </div>

    <h1 class="text-4xl font-bold text-gray-800 mb-2 font-serif heartbeat">Olá, <span class="text-amor-red">{{ wifeName }}</span></h1>
    <p class="text-gray-600 mb-8 italic">"Cada dia ao seu lado é um presente que a vida me deu."</p>

    <div class="bg-gradient-to-r from-amor-pink/20 to-amor-red/10 rounded-2xl p-4 mb-8 border border-amor-pink/30">
      <p class="text-sm text-gray-500 uppercase tracking-widest font-semibold mb-1">Nossa Jornada</p>
      <p class="text-3xl font-black text-amor-red">{{ daysTogether }} <span class="text-lg font-medium text-gray-600">Dias</span></p>
      <p class="text-xs text-gray-400 mt-1">de puro amor e cumplicidade</p>
    </div>

    <p-button label="Abrir Meus Cupons" icon="pi pi-heart-fill" size="large" (onClick)="openCoupons()" styleClass="w-full p-button-rounded p-button-danger shadow-xl font-bold tracking-wide" [style]="{'background': 'linear-gradient(to right, #e63946, #ffb3c6)', 'border': 'none', 'padding': '1rem'}"></p-button>
  </div>
</div>
