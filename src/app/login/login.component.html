<div class="min-h-screen bg-gradient-to-br from-[#fff0f3] via-[#ffb3c6] to-[#ffccd5] flex items-center justify-center font-sans p-6 overflow-hidden">
  <div class="w-full max-w-[393px] bg-white/40 backdrop-blur-3xl rounded-[3rem] p-10 shadow-2xl border border-white/60 text-center relative">
    
    <!-- Floating Hearts -->
    <div class="absolute inset-0 pointer-events-none opacity-40">
      <div class="floating-heart text-amor-red text-2xl" style="left: 10%; animation-delay: 0s;">❤️</div>
      <div class="floating-heart text-amor-pink text-3xl" style="left: 80%; animation-delay: 2s;">✨</div>
    </div>

    <!-- Decorative Elements -->
    <div class="absolute -top-10 -right-10 w-32 h-32 bg-amor-gold/30 rounded-full blur-2xl"></div>
    <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-amor-pink/40 rounded-full blur-2xl"></div>
    
    <div class="relative z-10">
      <div class="w-20 h-20 bg-gradient-to-br from-amor-red to-amor-pink rounded-full flex items-center justify-center mx-auto mb-6 shadow-[0_8px_20px_rgba(217,4,41,0.4)] border-4 border-white">
        <i class="pi pi-lock text-3xl text-white"></i>
      </div>
      
      <h2 class="text-3xl font-black text-rose-950 font-serif mb-2">Acesso Exclusivo</h2>
      <p class="text-gray-700 font-medium text-sm mb-8 px-4 leading-relaxed">Apenas a dona do meu coração pode entrar.<br>Qual é a nossa <b>senha secreta</b>?</p>
      
      <div class="relative mb-6">
        <input 
          type="text" 
          [(ngModel)]="passphrase" 
          (keyup.enter)="checkPassphrase()"
          class="w-full bg-white/80 border-[3px] border-transparent focus:border-amor-pink/50 rounded-2xl py-4 px-6 text-center text-xl font-bold text-amor-red placeholder-gray-400 outline-none transition-all shadow-inner"
          placeholder="Digite a palavra mágica..."
          autofocus
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
        >
        <div *ngIf="showError" class="absolute -bottom-8 left-0 right-0 text-red-500 text-xs font-bold animate-bounce-in bg-white/95 py-1.5 px-4 rounded-full inline-block mx-auto w-max shadow-sm border border-red-100">
          Ops, não é essa! Tente de novo.
        </div>
      </div>
      
      <!-- Hint Button Area -->
      <div class="mb-8 text-center min-h-[30px] flex justify-center items-center">
        <button *ngIf="!showHint" (click)="toggleHint()" class="text-[13px] font-bold text-amor-pink hover:text-amor-red transition-colors underline decoration-dotted underline-offset-4">
          Precisa de uma dica?
        </button>
        <p *ngIf="showHint" class="text-xs font-bold text-gray-600 bg-white/60 py-2 px-4 rounded-full shadow-sm animate-slide-up border border-white">
          Dica: Como eu te chamei quando nos conhecemos? 🌺
        </p>
      </div>
      
      <button 
        (click)="checkPassphrase()"
        [disabled]="isSuccess"
        class="w-full relative overflow-hidden bg-gradient-to-r from-[#d90429] to-[#ff4d6d] text-white font-black text-lg py-4 rounded-full shadow-[0_10px_20px_rgba(217,4,41,0.3)] hover:scale-105 active:scale-95 transition-all tracking-wider flex items-center justify-center gap-3 group disabled:opacity-90 disabled:hover:scale-100 disabled:active:scale-100"
      >
        <span *ngIf="!isSuccess">Destrancar o Coração</span>
        <span *ngIf="isSuccess" class="animate-pulse">Aberto com Sucesso!</span>
        
        <i *ngIf="!isSuccess" class="pi pi-key text-xl group-hover:rotate-12 transition-transform"></i>
        <i *ngIf="isSuccess" class="pi pi-heart-fill text-xl animate-bounce"></i>
        
        <!-- White glow effect on success -->
        <div *ngIf="isSuccess" class="absolute inset-0 bg-white/20 animate-pulse"></div>
      </button>
    </div>
  </div>
</div>
